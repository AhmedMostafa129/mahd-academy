<div class="container-fluid p-0">
    <div class="px-4 py-4">
        <!-- Header Section -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <h2 class="fw-bold m-0">Courses Management</h2>

            <div class="d-flex gap-3 align-items-center flex-grow-1 justify-content-end">
                <!-- Search Bar -->
                <div class="position-relative" style="max-width: 300px; width: 100%;">
                    <input type="text" class="form-control ps-4 rounded-pill border-0 shadow-sm bg-white"
                        placeholder="Search courses..." [(ngModel)]="searchTerm">
                    <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
                </div>
            </div>
        </div>

        <div *ngIf="loading" class="text-center mt-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <!-- Courses Grid -->
        <div *ngIf="!loading" class="courses-grid">
            <div class="row g-4">
                <!-- Course Card -->
                <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let course of filteredCourses">
                    <div class="course-card card border-0 shadow-sm h-100">
                        <div class="card-body">
                            <!-- Course Icon -->
                            <div class="course-icon-wrapper mb-3 text-center position-relative overflow-hidden"
                                style="height: 160px; border-radius: 8px; background: #f8f9fa;">
                                <!-- Image if available -->
                                <ng-container *ngIf="getCourseImageUrl(course) as imageUrl; else defaultIcon">
                                    <img [src]="imageUrl" alt="Course Cover" class="w-100 h-100 object-fit-cover">
                                </ng-container>

                                <!-- Default Icon fallback -->
                                <ng-template #defaultIcon>
                                    <div class="course-icon d-flex align-items-center justify-content-center h-100">
                                        <i class="bi bi-book-fill display-4 text-secondary opacity-50"></i>
                                    </div>
                                </ng-template>

                                <!-- Status Badge -->
                                <span
                                    class="status-badge badge bg-success rounded-pill position-absolute top-0 end-0 m-2">
                                    <i class="bi bi-check-circle-fill me-1"></i>Active
                                </span>
                            </div>

                            <!-- Course Info -->
                            <div class="course-info">
                                <h5 class="card-title mb-2 fw-bold">{{course.title}}</h5>
                                <p class="text-muted small mb-2">
                                    <i class="bi bi-person me-1"></i>{{course.instructorName}}
                                </p>
                                <p class="text-muted small mb-2">
                                    <i class="bi bi-tag me-1"></i>{{course.category || 'General'}}
                                </p>
                                <p class="text-success fw-bold mb-3">
                                    <i class="bi bi-currency-dollar"></i>{{course.price}}
                                </p>
                            </div>

                            <!-- Action Buttons -->
                            <div class="action-buttons d-flex gap-2 justify-content-center">
                                <button class="btn btn-sm btn-outline-primary flex-fill"
                                    (click)="onEdit(course.id || course._id || course.courseId)"
                                    [disabled]="!course.id && !course._id && !course.courseId" title="Edit Course">
                                    <i class="bi bi-pencil me-1"></i>Edit
                                </button>
                                <button class="btn btn-sm btn-outline-danger flex-fill"
                                    (click)="onDelete(course.id || course._id || course.courseId)"
                                    [disabled]="!course.id && !course._id && !course.courseId" title="Delete Course">
                                    <i class="bi bi-trash me-1"></i>Delete
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- No Courses Found -->
                <div class="col-12" *ngIf="filteredCourses.length === 0">
                    <div class="text-center py-5">
                        <i class="bi bi-search display-1 text-secondary opacity-25 mb-3"></i>
                        <h5 class="text-muted">No courses match your search</h5>
                        <p class="text-muted small">Try adjusting your search criteria</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Edit Course Modal -->
        <app-edit-course-modal [isOpen]="showEditModal" [courseId]="editingCourseId" (close)="onEditModalClose()"
            (courseUpdated)="onCourseUpdated()">
        </app-edit-course-modal>

        <!-- Delete Confirmation Modal -->
        <div *ngIf="showDeleteModal" class="delete-modal-overlay"
            style="position: fixed !important; inset: 0 !important; background: rgba(0,0,0,0.85) !important; display: flex !important; justify-content: center !important; align-items: center !important; z-index: 999999 !important;"
            (click)="closeDeleteModal()">
            <div class="delete-modal"
                style="max-width: 650px; width: 90%; background: white; padding: 2rem 2.5rem; border-radius: 20px; box-shadow: 0 30px 60px rgba(0,0,0,0.5); text-align: center; position: relative;"
                (click)="$event.stopPropagation()">
                <button class="modal-close-btn"
                    style="position: absolute; top: 15px; right: 15px; background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(239,68,68,0.4);"
                    (click)="closeDeleteModal()">
                    <i class="bi bi-x-lg" style="color: white; font-size: 1.2rem; font-weight: bold;"></i>
                </button>
                <div class="delete-icon"
                    style="width: 70px; height: 70px; margin: 0 auto 1.2rem; border-radius: 50%; background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%); display: flex; align-items: center; justify-content: center;">
                    <i class="bi bi-exclamation-triangle-fill" style="font-size: 2.5rem; color: #ef4444;"></i>
                </div>
                <h3 style="color: #1f2937; margin-bottom: 0.8rem; font-size: 1.6rem; font-weight: 700;">Confirm Delete
                </h3>
                <p class="delete-message"
                    style="color: #6b7280; margin-bottom: 1.8rem; line-height: 1.5; font-size: 1rem;">Are you sure you
                    want to delete this course? This action cannot be undone.</p>
                <div class="modal-actions" style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                    <button class="btn-cancel"
                        style="background: white; color: #6b7280; border: 2px solid #e5e7eb; padding: 0.8rem 2rem; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 1rem; min-width: 130px;"
                        (click)="closeDeleteModal()">Cancel</button>
                    <button class="btn-delete-confirm"
                        style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color: white; border: none; padding: 0.8rem 2rem; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 1rem; box-shadow: 0 6px 12px rgba(239,68,68,0.4); min-width: 150px;"
                        (click)="confirmDelete()">Delete Course</button>
                </div>
            </div>
        </div>
    </div>
</div>
